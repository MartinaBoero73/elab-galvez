<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Recibos | Gálvez</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800">

    <header class="bg-white shadow-sm py-4 px-6 border-b border-gray-200">
        <h1 class="text-xl font-bold text-blue-600">eLab Gálvez <span class="text-gray-400 font-normal text-sm ml-2">Asistente de Liquidación</span></h1>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <div class="w-1/3 bg-white p-6 border-r border-gray-200 shadow-lg z-10 flex flex-col overflow-y-auto">
            
            <div id="step-1" class="mb-8 transition-all">
                <div class="flex items-center mb-4">
                    <span class="bg-blue-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-sm font-bold mr-2">1</span>
                    <h2 class="text-xl font-bold">Verificar Textos</h2>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Archivo de Cabecera (TXT)</label>
                        <input type="file" id="file-cabecera" accept=".txt" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Archivo de Detalle (TXT)</label>
                        <input type="file" id="file-detalle" accept=".txt" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md">
                    </div>
                    <button id="btn-verificar" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-4 rounded-md shadow transition-colors">
                        Validar Modelo
                    </button>
                </div>
                
                <div id="resumen-card" class="mt-4 bg-green-50 border border-green-200 rounded-md p-4 hidden">
                    <p class="text-xs text-green-600 font-bold uppercase mb-2">✓ Parseo Exitoso</p>
                    <ul class="text-sm space-y-1">
                        <li><b>Empleado:</b> <span id="res-empleado"></span></li>
                        <li><b>Sueldo Neto:</b> $<span id="res-neto"></span></li>
                        <li><b>Costo Empleador:</b> $<span id="res-costo"></span></li>
                    </ul>
                </div>
            </div>

            <hr class="border-gray-200 mb-8">

            <div id="step-2" class="opacity-50 pointer-events-none transition-all">
                <div class="flex items-center mb-4">
                    <span class="bg-gray-400 text-white rounded-full w-6 h-6 flex items-center justify-center text-sm font-bold mr-2" id="badge-2">2</span>
                    <h2 class="text-xl font-bold">Imágenes y PDF</h2>
                </div>

                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Logo Empresa (opcional)</label>
                        <input type="file" id="file-logo" accept="image/png, image/jpeg" class="block w-full text-xs text-gray-500 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-gray-100 file:text-gray-700 border border-gray-200 rounded-md cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Firma Empleador (opcional)</label>
                        <input type="file" id="file-firma-emp" accept="image/png, image/jpeg" class="block w-full text-xs text-gray-500 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-gray-100 file:text-gray-700 border border-gray-200 rounded-md cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Firma Trabajador (opcional)</label>
                        <input type="file" id="file-firma-trab" accept="image/png, image/jpeg" class="block w-full text-xs text-gray-500 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-gray-100 file:text-gray-700 border border-gray-200 rounded-md cursor-pointer">
                    </div>
                </div>

                <button id="btn-generar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center">
                    <span id="btn-text">Generar y Previsualizar PDF</span>
                </button>
            </div>

        </div>

        <div class="w-2/3 bg-gray-300 p-4 relative">
            <div id="placeholder-view" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p>Completá los pasos para visualizar el recibo</p>
            </div>
            
            <iframe id="pdf-viewer" class="w-full h-full shadow-2xl rounded-sm hidden bg-white" src="" type="application/pdf"></iframe>
        </div>
    </main>

    <script>
        const btnVerificar = document.getElementById('btn-verificar');
        const btnGenerar = document.getElementById('btn-generar');
        const btnGenerarText = document.getElementById('btn-text');
        
        const fileCabecera = document.getElementById('file-cabecera');
        const fileDetalle = document.getElementById('file-detalle');
        
        const step2 = document.getElementById('step-2');
        const badge2 = document.getElementById('badge-2');
        const resumenCard = document.getElementById('resumen-card');
        
        const pdfViewer = document.getElementById('pdf-viewer');
        const placeholderView = document.getElementById('placeholder-view');

        btnVerificar.addEventListener('click', async () => {
            if (!fileCabecera.files[0] || !fileDetalle.files[0]) {
                alert("Por favor subí ambos archivos TXT (Cabecera y Detalle).");
                return;
            }

            btnVerificar.textContent = "Validando...";
            const formData = new FormData();
            formData.append("txt_cabecera", fileCabecera.files[0]);
            formData.append("txt_detalle", fileDetalle.files[0]);

            try {
                const res = await fetch('/api/verificar', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.status === "ok") {
                    document.getElementById('res-empleado').textContent = data.empleado;
                    document.getElementById('res-neto').textContent = data.sueldo_neto.toLocaleString('es-AR');
                    document.getElementById('res-costo').textContent = data.costo_total.toLocaleString('es-AR');
                    resumenCard.classList.remove('hidden');
                    
                    step2.classList.remove('opacity-50', 'pointer-events-none');
                    badge2.classList.remove('bg-gray-400');
                    badge2.classList.add('bg-blue-600');
                    btnVerificar.textContent = "Validar Modelo";
                } else {
                    alert("Error parseando: " + data.message);
                    btnVerificar.textContent = "Validar Modelo";
                }
            } catch (err) {
                alert("Error de conexión");
                btnVerificar.textContent = "Validar Modelo";
            }
        });

        btnGenerar.addEventListener('click', async () => {
            btnGenerarText.textContent = "Compilando PDF...";
            btnGenerar.disabled = true;

            const formData = new FormData();
            formData.append("txt_cabecera", fileCabecera.files[0]);
            formData.append("txt_detalle", fileDetalle.files[0]);
            
            if (document.getElementById('file-logo').files[0]) 
                formData.append("logo", document.getElementById('file-logo').files[0]);
            if (document.getElementById('file-firma-emp').files[0]) 
                formData.append("firma_emp", document.getElementById('file-firma-emp').files[0]);
            if (document.getElementById('file-firma-trab').files[0]) 
                formData.append("firma_trab", document.getElementById('file-firma-trab').files[0]);

            try {
                const response = await fetch('/api/generar', { method: 'POST', body: formData });
                
                if (!response.ok) throw new Error("Error generando PDF");

                const blob = await response.blob();
                const pdfUrl = URL.createObjectURL(blob);
                
                placeholderView.classList.add('hidden');
                pdfViewer.src = pdfUrl;
                pdfViewer.classList.remove('hidden');

            } catch (err) {
                alert(err.message);
            } finally {
                btnGenerarText.textContent = "Generar y Previsualizar PDF";
                btnGenerar.disabled = false;
            }
        });
    </script>
</body>
</html>
