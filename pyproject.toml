[project]
name = "elab-galvez"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pydantic>=2.14.1",
    "reportlab>=5.0.1",
    "fastapi[standard]>=0.115.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.5.2",
    "num2words>=0.5.14",
    "pillow>=12.3.0",
    "mangum>=0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "elab_galvez"
module-root = "src"
